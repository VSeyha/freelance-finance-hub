<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners and border -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  <rect width="30" height="30" x="1" y="1" rx="6" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Fintech Lightning / Growth Bolt symbol -->
  <path
    d="M17.5 4.5 L8.5 16.5 L15 16.5 L13 27.5 L23.5 14.5 L17 14.5 Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />
</svg>
